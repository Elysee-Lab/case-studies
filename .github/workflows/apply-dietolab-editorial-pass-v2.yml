          git config user.email case-study-deploy-bot@users.noreply.github.com
          git add index.html
          test "$(git diff --cached --name-only)" = "index.html"
          git commit -m 'edit: make DietoLab narrative case-study led'
          git push origin HEAD:dietolab-safe-restore
