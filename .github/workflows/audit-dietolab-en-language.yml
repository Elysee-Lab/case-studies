name: Audit DietoLab EN language

on:
  push:
    branches: [dietolab-safe-restore]
    paths:
      - '.github/workflows/audit-dietolab-en-language.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dietolab-safe-restore
      - name: Scan EN block for Polish-language artefacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          marker='<div class="lang-report active" data-lang="pl"'
          en=s.split(marker,1)[0]
          print('POLISH-DIACRITIC TOKENS:')
          toks=sorted(set(re.findall(r'\b\w*[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]\w*\b',en)))
          print(toks)
          print('\nCURATED PHRASES FOUND:')
          phrases=['punkt odniesienia','oferta wysłana','nieobecność na rozmowie','odrzucone','rozmowa zakończona','w toku','brak ','gotowe','rozwiązane','lokalnym','Media społecznościowe','wartość','wdrożenie','Działania','Efekt','wynik','źródło','strona','płatność','przychód','koszt','rezerwacja','pacjent','dietetyk','firmy','badanie','wygrana','realizacja']
          for p in phrases:
              if p.lower() in en.lower(): print(p)
          print('\nLINES WITH POLISH DIACRITICS:')
          for line in en.splitlines():
              if re.search(r'[ąćęłńóśźżĄĆĘŁŃÓŚŹŻ]',line): print(line[:1200])
          PY
