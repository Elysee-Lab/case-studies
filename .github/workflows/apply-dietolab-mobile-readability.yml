name: Apply DietoLab mobile readability

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_dietolab_mobile_readability.py'
      - '.github/workflows/apply-dietolab-mobile-readability.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply focused mobile/readability patch
        run: python scripts/apply_dietolab_mobile_readability.py
      - name: Verify regression contract before commit
        run: python scripts/test_dietolab_mobile_readability.py
      - name: Verify scope
        run: |
          git diff -- index.html
          test -z "$(git status --porcelain | grep -v '^ M index.html$')"
      - name: Commit verified index only
        run: |
          git config user.name 'case-study-deploy-bot'
          git config user.email 'case-study-deploy-bot@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: improve DietoLab mobile readability and timeline'
          git push origin HEAD:main
